spring.application.name=backend

# ---- Ollama (local embeddings) ----
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.options.model=nomic-embed-text

ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:nomic-embed-text}
# Must match the vector(N) column created by the Flyway migrations (nomic-embed-text = 768).
ollama.embedding-dimensions=768

# ---- PostgreSQL + pgvector ----
# Defaults match the docker-compose.yml at the repository root.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/movies_vectors}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Prince.a123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- Application ----
# Loads Movies.json into the database on startup. Movies that already exist
# (matched by title) are skipped, so restarts do not re-embed anything.
app.seed.enabled=true
# Number of movies returned by the search endpoint.
app.search.limit=3
